{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PrivatePing - end-to-end encrypted, ephemeral chat rooms" />
    <meta name="referrer" content="same-origin" />
    <script src="{% static 'vendor/jquery/jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'js/common.js' %}"></script>
    <link rel="stylesheet" href="{% static 'fonts/fonts.min.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/favicons/apple-touch-icon.png' %}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicons/favicon-32x32.png' %}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicons/favicon-16x16.png' %}" />
    <link rel="icon" type="image/png" sizes="192x192"
        href="{% static 'images/favicons/android-chrome-192x192.png' %}" />
    <link rel="icon" type="image/png" sizes="512x512"
        href="{% static 'images/favicons/android-chrome-512x512.png' %}" />
    <link rel="icon" href="{% static 'images/favicons/favicon.ico' %}" />

    {% block content %}{% endblock %}

    {% include "chat/_flash.html" %}
    </body>

</html>
