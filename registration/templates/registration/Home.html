{% extends "registration/Base.html" %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/registration/registration_home.css' %}" />

<title>PrivatePing: A secure messaging Application</title>
</head>

<body data-title="PrivatePing: A secure messaging Application">
  <span id="pageloader" class="pageloader"></span>

  <div id="Maincontent" class="container">
    <img class="logo" src="{% static '/images/logo/png/logo-no-background.png' %}" alt="Logo" />
    <div class="buttons">
      <button type="button" data-href="{% url 'registration:login' %}">Login</button>
      <button type="button" data-href="{% url 'registration:register' %}">Signup</button>
    </div>
    <div class="buttons">
      <button type="button" data-href="{% url 'registration:anonymous_direct_login' %}">Anonymous Direct Login</button>

    <b>

    <div class="buttons">
      <h5 class="credits" id="credits">An open source project, Initiated by

        <a target="_blank" rel="noopener noreferrer" href="https://linkedin.com/in/princekhunt">Prince Khunt</a> &
        <a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/viraj-bhingradiya-720b39216">Viraj Bhingradiya</a>. Give a
        ⭐️ on <a target="_blank" rel="noopener noreferrer" href="https://github.com/princekhunt/privateping">Github</a>.
        <br>Checkout
        <a target="_blank" rel="noopener" href="/humans.txt">Contributors!</a>
      </h5>

  {% endblock %}
